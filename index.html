<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F5F7">
  <title>Журнал производства</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Заставка «Амина»: видна сразу, пока грузятся скрипты и данные; app.js её убирает ===== -->
  <div class="splash go" id="splash" role="status" aria-label="Загрузка">
    <svg class="splash__bg splash__bg--land" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sp-t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8f7c"/><stop offset="1" stop-color="#1d5a4a"/></linearGradient>
        <linearGradient id="sp-t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5a42"/><stop offset="1" stop-color="#5c3326"/></linearGradient>
      </defs>
      <rect width="160" height="100" fill="url(#sp-t1)"/>
      <polygon points="96,0 160,0 160,100 66,100" fill="url(#sp-t2)"/>
    </svg>
    <svg class="splash__bg splash__bg--port" viewBox="0 0 100 217" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sp-p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8f7c"/><stop offset="1" stop-color="#1d5a4a"/></linearGradient>
        <linearGradient id="sp-p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5a42"/><stop offset="1" stop-color="#5c3326"/></linearGradient>
      </defs>
      <rect width="100" height="217" fill="url(#sp-p1)"/>
      <polygon points="0,150 100,112 100,217 0,217" fill="url(#sp-p2)"/>
    </svg>
    <!-- горшки: горизонтально падают справа сверху вниз, вертикально пролетают слева направо -->
    <div class="splash__pots splash__pots--land" aria-hidden="true">
      <img class="pot" src="splash/pot-red-flowers.webp" alt="" style="--w:14cqw;--x0:60cqw;--y0:-30cqw;--x1:68cqw;--y1:72cqw;--r0:-14deg;--r1:10deg;--t:10s;--d:0s">
      <img class="pot" src="splash/pot-pink-roses.webp" alt="" style="--w:14cqw;--x0:80cqw;--y0:-32cqw;--x1:72cqw;--y1:74cqw;--r0:-16deg;--r1:12deg;--t:12s;--d:-5s">
      <img class="pot" src="splash/pot-red-sprout.webp" alt="" style="--w:12cqw;--x0:70cqw;--y0:-28cqw;--x1:84cqw;--y1:72cqw;--r0:10deg;--r1:-18deg;--t:9s;--d:-3s">
      <img class="pot" src="splash/pot-terracotta.webp" alt="" style="--w:11cqw;--x0:88cqw;--y0:-26cqw;--x1:78cqw;--y1:70cqw;--r0:-20deg;--r1:8deg;--t:11s;--d:-8s">
      <img class="pot" src="splash/pot-black-herb.webp" alt="" style="--w:12cqw;--x0:62cqw;--y0:-32cqw;--x1:56cqw;--y1:76cqw;--r0:-8deg;--r1:15deg;--t:13s;--d:-10s">
      <img class="pot" src="splash/pot-white-planter.webp" alt="" style="--w:10cqw;--x0:76cqw;--y0:-28cqw;--x1:90cqw;--y1:72cqw;--r0:18deg;--r1:-6deg;--t:10.5s;--d:-6.5s">
    </div>
    <div class="splash__pots splash__pots--port" aria-hidden="true">
      <img class="pot" src="splash/pot-red-flowers.webp" alt="" style="--w:26cqw;--x0:-34cqw;--y0:150cqw;--x1:120cqw;--y1:132cqw;--r0:-8deg;--r1:10deg;--t:11s;--d:0s">
      <img class="pot" src="splash/pot-pink-roses.webp" alt="" style="--w:24cqw;--x0:-30cqw;--y0:176cqw;--x1:125cqw;--y1:160cqw;--r0:8deg;--r1:-12deg;--t:13s;--d:-5s">
      <img class="pot" src="splash/pot-red-sprout.webp" alt="" style="--w:21cqw;--x0:-28cqw;--y0:136cqw;--x1:122cqw;--y1:150cqw;--r0:-14deg;--r1:8deg;--t:9s;--d:-3s">
      <img class="pot" src="splash/pot-terracotta.webp" alt="" style="--w:20cqw;--x0:-26cqw;--y0:165cqw;--x1:120cqw;--y1:182cqw;--r0:10deg;--r1:-14deg;--t:10s;--d:-7s">
      <img class="pot" src="splash/pot-black-herb.webp" alt="" style="--w:23cqw;--x0:-32cqw;--y0:188cqw;--x1:124cqw;--y1:172cqw;--r0:-6deg;--r1:12deg;--t:12s;--d:-9s">
      <img class="pot" src="splash/pot-white-planter.webp" alt="" style="--w:18cqw;--x0:-24cqw;--y0:140cqw;--x1:118cqw;--y1:128cqw;--r0:6deg;--r1:-10deg;--t:8.5s;--d:-6s">
    </div>
    <div class="splash__content">
      <div class="splash__card"><img class="splash__logo" src="splash/logo.png" alt="Амина"></div>
      <div class="splash__slogan">Амина – все для<br>зеленого бизнеса</div>
      <div class="splash__pill"><i></i><span>ЗАГРУЗКА</span></div>
    </div>
    <div class="splash__sig">Идея и разработка — <b>А. Н. Меньков</b></div>
  </div>

  <!-- ===== Экран 1: начало смены ===== -->
  <section id="screen-start" class="screen screen--center">
    <div class="card card--start" id="start-step-1">
      <div class="logo logo--full start-logo" id="start-logo" role="img" aria-label="AMINA"></div>
      <h1 class="card__title">Журнал производства</h1>
      <div class="start-clock">
        <div class="start-clock__time" id="start-time">--:--</div>
        <div class="start-clock__date" id="start-date"></div>
      </div>
      <div class="start-info">
        <p class="start-schedule" id="start-schedule"></p>
        <p class="start-running" id="start-running" hidden></p>
        <p class="start-down" id="start-down" hidden></p>
      </div>
      <button class="btn btn--oval" id="btn-take-shift">Заступить на смену</button>
      <button class="btn btn--ghost btn--viewer" id="btn-viewer">Режим зрителя</button>
    </div>

    <form class="card card--form" id="start-step-2" hidden>
      <h2 class="card__title">Данные смены</h2>

      <label class="field">
        <span class="field__label">Мастер</span>
        <select id="f-master" required></select>
      </label>

      <label class="field" id="f-master-other-wrap" hidden>
        <span class="field__label">Фамилия мастера</span>
        <input id="f-master-other" type="text" placeholder="Введите фамилию" autocomplete="off">
      </label>

      <label class="field" id="f-number-wrap">
        <span class="field__label">Номер смены</span>
        <select id="f-number"></select>
      </label>

      <div class="field">
        <span class="field__label">Тип смены</span>
        <div class="segmented" id="f-type"></div>
      </div>

      <div class="field">
        <span class="field__label">Начало смены</span>
        <div class="field__auto" id="f-start">—</div>
      </div>

      <div class="card__actions">
        <button type="button" class="btn btn--ghost" id="btn-back">Назад</button>
        <button type="submit" class="btn btn--oval">Начать смену</button>
      </div>
    </form>
  </section>

  <!-- ===== Экран 2: основное окно ===== -->
  <section id="screen-main" class="screen" hidden>
    <div class="app">
      <!-- Знак предприятия (по нажатию — вкладка «Смена»), информация о смене и часы — один блок.
           В правом углу выглядывает солнце (дневная смена) или месяц (ночная). -->
      <div class="box app__info">
        <button class="info__logo" id="btn-home" title="Смена" aria-label="Открыть вкладку «Смена»"></button>
        <div class="info__shift" id="shift-info"></div>
        <div class="info__clock">
          <div class="clock__time" id="clock-time">--:--</div>
          <div class="clock__date" id="clock-date"></div>
        </div>
        <span class="info__sky" id="shift-sky" aria-hidden="true"></span>
      </div>

      <div class="app__end">
        <div class="save-status" id="save-status" role="button" tabindex="0" aria-live="polite"></div>
        <button class="btn btn--outline" id="btn-end-shift">Закончить смену</button>
      </div>

      <nav class="app__nav">
        <div class="nav__tabs" id="nav-tabs"></div>
        <div class="nav__foot">
          <div class="nav__logo-area"><div class="logo nav__logo" id="nav-logo" role="img" aria-label="AMINA"></div></div>
          <button class="tab tab--settings" id="btn-settings" title="Настройки" aria-label="Настройки">
            <span class="tab__icon" data-icon="settings"></span>
            <span class="tab__label">Настройки</span>
          </button>
        </div>
      </nav>

      <main class="box app__panel">
        <div class="panel__content" id="panel"></div>
        <button class="edit-btn" id="btn-edit" title="Редактировать" hidden>
          <span class="edit-btn__icon"></span>
          <span class="edit-btn__label">Редактировать</span>
        </button>
        <button class="fab" id="fab" hidden></button>
      </main>
    </div>
  </section>

  <!-- ===== Модальное окно ===== -->
  <div class="modal" id="modal" hidden>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <h3 class="modal__title" id="modal-title"></h3>
      <div class="modal__body" id="modal-body"></div>
      <div class="modal__actions" id="modal-actions"></div>
    </div>
  </div>

  <input type="file" id="file-import" accept=".json,application/json" hidden>

  <script src="js/config.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/data.js"></script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-auth-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/cloud.js"></script>
  <script src="manuals/kb.js"></script>
  <script src="manuals/kb-sigma-common.js"></script>
  <script src="manuals/kb-omron.js"></script>
  <script src="manuals/kb-yaskawa.js"></script>
  <script src="manuals/kb-atlas-copco.js"></script>
  <script src="manuals/kb-cross-air.js"></script>
  <script src="manuals/kb-shini.js"></script>
  <script src="manuals/kb-delta.js"></script>
  <script src="manuals/kb-hcfa.js"></script>
  <script src="manuals/kb-mitsubishi.js"></script>
  <script src="manuals/kb-invt.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
